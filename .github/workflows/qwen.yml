name: Qwen Train

on:
  schedule:
    - cron: "0 */6 * * *"        # Every Friday 1:53 AM
  workflow_dispatch:             # Manual trigger

permissions:
  contents: write

jobs:
  qwen_train:
    runs-on: ubuntu-latest
    # GitHub free tier hard limit: 6 hours
    timeout-minutes: 355

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create necessary directories
        run: |
          mkdir -p ./csv/llm_model_qwen
          mkdir -p ./csv/xgboost
          mkdir -p ./csv/ppo_models
          mkdir -p ./csv/ppo_models/per_symbol
          mkdir -p ./csv/ppo_models/ensemble
          mkdir -p ./csv/agentic_loop_logs
          echo "✅ Directories created"
          echo "Current directory: $(pwd)"
          ls -la ./csv/

      - name: Verify folders
        run: |
          echo "=== Checking ./csv ==="
          ls -la ./csv/
          echo "=== Checking ./csv/llm_model_qwen ==="
          ls -la ./csv/llm_model_qwen/ | head -10
          echo "=== Checking ./csv/xgboost ==="
          ls -la ./csv/xgboost/ | head -10
          echo "=== Checking ./csv/ppo_models ==="
          ls -la ./csv/ppo_models/
          echo "=== Checking ./csv/ppo_models/per_symbol ==="
          ls -la ./csv/ppo_models/per_symbol/

      - name: Install dependencies
        run: |
          pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('PyTorch installed:', torch.__version__)"

          pip install --force-reinstall transformers==4.40.0
          python -c "import transformers; print(f'Transformers: {transformers.__version__}')"
          python -c "from transformers import TrainingArguments; print('TrainingArguments OK')"

          pip install accelerate==0.33.0
          pip install peft==0.10.0
          pip install huggingface_hub requests joblib

          pip install -r requirements.txt

      # =========================================================
      # ✅ Single step: qwen.py handles everything
      #    (download → generate data → train)
      # =========================================================
      - name: Run Qwen pipeline
        env:
          MONGODBEMAIL_URI: ${{ secrets.MONGODBEMAIL_URI }}
          MONGO_URL: ${{ secrets.MONGO_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_TRADE }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_TRADE }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          hf_token: ${{ secrets.HF_TOKEN }}
        run: |
          # ✅ Prefer qwen.py, fallback to train.py
          if [ -f qwen.py ]; then
            echo "🚀 Running qwen.py"
            python qwen.py
          elif [ -f train.py ]; then
            echo "🚀 Running train.py"
            python train.py
          else
            echo "❌ qwen.py / train.py not found!"
            exit 1
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-training-logs-${{ github.run_number }}
          path: |
            ./csv/current_training_status.json
            ./csv/agentic_loop_logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_TRADE }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_TRADE }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=⚠️ Qwen Training FAILED (run #${{ github.run_number }})" || true
