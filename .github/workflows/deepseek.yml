name: DeepSeek Train

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deepseek_train:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create necessary directories
        run: |
          mkdir -p ./csv/llm_model_deepseek
          mkdir -p ./csv/deepseek_checkpoints
          mkdir -p ./csv/xgboost
          mkdir -p ./csv/ppo_models
          mkdir -p ./csv/ppo_models/per_symbol
          mkdir -p ./csv/agentic_loop_logs
          echo "✅ Directories created"
          ls -la ./csv/

      - name: Install dependencies
        run: |
          echo "📦 Installing PyTorch..."
          pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('PyTorch:', torch.__version__)"

          echo "📦 Installing LLM stack..."
          pip install --no-deps \
            "transformers==4.51.0" \
            "hf_xet" \
            "huggingface_hub[hf_xet]==0.30.0" \
            "tokenizers==0.21.1" \
            "accelerate==1.0.1" \
            "peft==0.13.2" \
            "regex>=2023.a0" \
            "safetensors>=0.4.1" \
            "pyyaml>=5.1" \
            "filelock" \
            "packaging>=20.0" \
            "tqdm"

          echo "📦 Installing data science stack..."
          pip install \
            "pandas>=2.0.0" \
            "numpy<2.0" \
            "scikit-learn" \
            "joblib>=1.3.0" \
            "matplotlib>=3.5.0" \
            "xgboost" \
            "optuna" \
            "numba" \
            "shimmy"

          echo "📦 Installing RL stack..."
          pip install \
            "stable-baselines3>=2.0.0" \
            "gymnasium>=0.29.0"

          echo "📦 Installing web/API stack..."
          pip install \
            "fastapi" \
            "uvicorn" \
            "requests>=2.31.0" \
            "urllib3>=2.0.0" \
            "certifi>=2023.0.0" \
            "curl_cffi"

          echo "📦 Installing utilities..."
          pip install \
            "pymongo" \
            "ta" \
            "python-dotenv" \
            "fpdf2>=2.7.0" \
            "schedule>=1.2.0" \
            "beautifulsoup4" \
            "lxml" \
            "pytz>=2023.0" \
            "fastdtw"

          echo "✅ All dependencies installed"

      - name: Verify dependency versions
        run: |
          python -c "
          import transformers
          import huggingface_hub
          import tokenizers
          import torch

          print('=' * 50)
          print(f'Transformers:    {transformers.__version__}')
          print(f'HF Hub:          {huggingface_hub.__version__}')
          print(f'Tokenizers:      {tokenizers.__version__}')
          print(f'PyTorch:         {torch.__version__}')
          print('=' * 50)

          assert transformers.__version__ == '4.51.0'
          assert huggingface_hub.__version__ == '0.30.0'
          assert tokenizers.__version__ == '0.21.1'
          print('✅ All versions correct!')
          "

      - name: Verify DeepSeek architecture support
        run: |
          python -c "
          from transformers import AutoConfig
          import transformers
          print(f'Transformers: {transformers.__version__}')

          from transformers.models.auto.configuration_auto import CONFIG_MAPPING
          if 'qwen2' in CONFIG_MAPPING:
              print('✅ Qwen2 architecture supported')
          else:
              print('❌ Qwen2 NOT supported!')
              exit(1)
          "

      - name: Run DeepSeek pipeline
        env:
          MONGODBEMAIL_URI: ${{ secrets.MONGODBEMAIL_URI }}
          MONGO_URL: ${{ secrets.MONGO_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_TRADE }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_TRADE }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          hf_token: ${{ secrets.HF_TOKEN }}
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python deepseek.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-logs-${{ github.run_number }}
          path: |
            ./csv/current_training_status.json
            ./csv/agentic_loop_logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_TRADE }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_TRADE }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=⚠️ DeepSeek Training FAILED (run #${{ github.run_number }})" || true
